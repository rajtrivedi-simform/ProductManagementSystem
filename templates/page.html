<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-secondary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/ProductManagementSystem/">Product Management System</a>
      </div>
    </nav>
    <main class="container my-5 p-5">
      <div class="product-details container-fluid row">
        <div class="col-md-6 text-center">
          <img src="" alt="" class="img-fluid my-3" />
        </div>
        <div class="col-md-6 text-center text-md-left">
          <h2 class="prodName"></h2>
          <p class="description"></p>
          <p class="price h4"></p>
          <p class="sellingType"></p>
          <p class="prodType"></p>
          <a href="" class="edit btn btn-primary"
            >Edit <i class="fa-solid fa-pen-to-square"></i
          ></a>
          <button class="btn btn-danger">
            Delete <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
    </main>
    <script src="../scripts/renderPage.js"></script>
    <style>
      body > main.container {
        background-color: #fff;
        border-radius: 1rem;
        box-shadow: rgba(0, 0, 0, 0.17) 0px -23px 25px 0px inset,
          rgba(0, 0, 0, 0.15) 0px -36px 30px 0px inset,
          rgba(0, 0, 0, 0.1) 0px -79px 40px 0px inset,
          rgba(0, 0, 0, 0.06) 0px 2px 1px, rgba(0, 0, 0, 0.09) 0px 4px 2px,
          rgba(0, 0, 0, 0.09) 0px 8px 4px, rgba(0, 0, 0, 0.09) 0px 16px 8px,
          rgba(0, 0, 0, 0.09) 0px 32px 16px;
      }
    </style>
  </body>
</html>
