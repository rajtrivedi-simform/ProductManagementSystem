<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">Product Management System</a>
        </div>
      </nav>
      <br>
    <h1 class="text-center">Add Product</h1>
    <form class="form container-sm">
      <div class="mb-3">
        <label for="prodName" class="form-label">Product name:</label>
        <input type="text" id="prodName" name="prodName" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="prodDesc" class="form-label">Product Description:</label>
        <textarea id="prodDesc" name="prodDesc" class="form-control" required></textarea>
      </div>
      <div class="mb-3">
        <label for="prodPrice" class="form-label">Product Price:</label>
        <input type="number" min="0" id="prodPrice" name="prodPrice" class="form-control" required/>
      </div>
      <div class="mb-3">
        <label for="prodImg" class="form-label">Product Image:</label>
        <input type="file" id="prodImg" name="prodImg" accept=".jpg,.jpeg,.png" class="form-control" required/>
      </div>
      <div class="mb-3">
        <label for="prodType" class="form-label">Product Category:</label>
        <select id="prodType" class="form-control" name="prodType" required>
          <option value="Electronics">Electronics</option>
          <option value="Appearals">Appearals</option>
          <option value="Accessories">Accessories</option>
          <option value="Grocery">Grocery</option>
          <option value="Utilities">Utilities</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="wholesale">Selling Type:</label>
        <div class="form-check"></div>
            <input class="form-check-input" type="radio" name="sellingType" id="retail" value="retail" />
            <label class="form-check-label" for="retail">Retail</label>
            &nbsp;
            &nbsp;
            &nbsp;
            <input class="form-check-input" type="radio" name="sellingType" id="wholesale" value="wholesale" />
            <label class="form-check-label" for="wholesale">Wholesale</label>
        </div>
      </div>
      <div class="mb-3">
        <input type="submit" value="Add Product" class="btn btn-primary">
      </div>
    </form>
    <script src="/scripts/addProduct.js"></script>
  </body>
</html>
