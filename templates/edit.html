<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit&nbsp;</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">Product Management System</a>
        </div>
      </nav>
    <form class="form container-sm mt-3">
      <div class="mb-3">
        <label for="prodName" class="form-label">Product name:</label>
        <input type="text" id="prodName" class="form-control" name="prodName" required/>
      </div>
      <div class="mb-3">
        <label for="prodDesc" class="form-label">Product Description:</label>
        <textarea id="prodDesc" class="form-control" name="prodDesc" required></textarea>
      </div>
      <div class="mb-3">
        <label for="prodPrice" class="form-label">Product Price:</label>
        <input type="number" id="prodPrice" class="form-control" name="prodPrice" required/>
      </div>
      <div class="mb-3">
        <img src="" alt="" class="prodImg m-1" name="prodImg" height="100px" width="100px">
        <label for="prodImg" class="form-label">Product Image:</label>
        <input type="file" id="prodImg" class="form-control"  name="prodImg"/>
      </div>
      <div class="mb-3">
        <label for="prodType" class="form-label">Product Category:</label>
        <select id="prodType" class="form-control" name="prodType" required>
          <option value="Electronics">Electronics</option>
          <option value="Appearals">Appearals</option>
          <option value="Accessories">Accessories</option>
          <option value="Grocery">Grocery</option>
          <option value="Utilities">Utilities</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="wholesale">Selling Type:</label>
        <!-- <input type="text" disabled class="form-control" name="sellingType"> -->
        <div class="form-check"></div>
            <input class="form-check-input" type="radio" name="sellingType" id="retail" value="retail" />
            <label class="form-check-label" for="retail">Retail</label>
            &nbsp;
            &nbsp;
            &nbsp;
            <input class="form-check-input" type="radio" name="sellingType" id="wholesale" value="wholesale" />
            <label class="form-check-label" for="wholesale">Wholesale</label>
        </div>
      </div>
      <div class="mb-3">
        <input type="submit" value="Edit Product" class="btn btn-primary">
      </div>
    </form>
  </body>
  <script src="/scripts/editProduct.js"></script>
</html>
