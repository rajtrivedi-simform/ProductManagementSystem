<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="bg-secondary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Product Management System</a>
        <input
          type="search"
          id="form1"
          class="form-control search"
          placeholder="Search...."
          aria-label="Search"
        />
      </div>
    </nav>
    <div class="filter-container d-flex justify-content-evenly mt-5">
      <select class="form-select" aria-label="Default select example">
        <option selected value="">Filter Products</option>
        <option value="Electronics">Electronics</option>
        <option value="Appearals">Appearals</option>
        <option value="Accessories">Accessories</option>
        <option value="Grocery">Grocery</option>
        <option value="Utilities">Utilities</option>
        <option value="Other">Other</option>
      </select>
      <button class="btn btn-primary filter">Apply</button>
      <button class="btn btn-primary reset">Reset</button>
    </div>
    <div class="content-div container p-5"></div>
    <script src="/scripts/script.js"></script>
    <style>
      .text-truncate {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      body > nav > div > input.search {
        width: 300px;
      }

      body > .content-div > div.container-fluid {
        background-color: #fff;
        border-radius: 1rem;
        box-shadow: rgba(0, 0, 0, 0.17) 0px -23px 25px 0px inset,
          rgba(0, 0, 0, 0.15) 0px -36px 30px 0px inset,
          rgba(0, 0, 0, 0.1) 0px -79px 40px 0px inset,
          rgba(0, 0, 0, 0.06) 0px 2px 1px, rgba(0, 0, 0, 0.09) 0px 4px 2px,
          rgba(0, 0, 0, 0.09) 0px 8px 4px, rgba(0, 0, 0, 0.09) 0px 16px 8px,
          rgba(0, 0, 0, 0.09) 0px 32px 16px;
      }

      body > .content-div > div.container-fluid > div.card > img {
        border-bottom: 1px solid black;
      }
      body > .filter-container {
        background-color: #fff;
        width: 600px;
        margin: 0 auto;
        padding: 1rem;
        border-radius: 1rem;
        box-shadow: rgba(0, 0, 0, 0.17) 0px -23px 25px 0px inset,
          rgba(0, 0, 0, 0.15) 0px -36px 30px 0px inset,
          rgba(0, 0, 0, 0.1) 0px -79px 40px 0px inset,
          rgba(0, 0, 0, 0.06) 0px 2px 1px, rgba(0, 0, 0, 0.09) 0px 4px 2px,
          rgba(0, 0, 0, 0.09) 0px 8px 4px, rgba(0, 0, 0, 0.09) 0px 16px 8px,
          rgba(0, 0, 0, 0.09) 0px 32px 16px;
      }
      body > .filter-container > .form-select {
        width: 400px;
      }
    </style>
  </body>
</html>
